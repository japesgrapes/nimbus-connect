# Windows x64 only, derived from RustDesk 1.5.0 official build jobs.
name: Build Nimbus Connect Windows x64
'on':
  workflow_dispatch: null
  push:
    branches:
    - nimbus-1.5.0
permissions:
  contents: read
concurrency:
  group: nimbus-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  VERSION: 1.5.0
  UPLOAD_ARTIFACT: 'true'
jobs:
  generate-bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
          extra-build-args: ''
          flutter-version: 3.22.3
          artifact-name: bridge-artifact
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: bridge-${{ matrix.job.os }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ matrix.job.flutter-version }}
        cache: true
    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        else
          # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
          # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
          bash .github/patches/apply_flutter_3.44_source_patches.sh
        fi
        pushd flutter && flutter pub get && popd
    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.job.artifact-name }}
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
    env:
      CARGO_EXPAND_VERSION: 1.0.95
      FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
      RUST_VERSION: '1.75'
    timeout-minutes: 90
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: windows-2022
          platform: x64
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        persist-credentials: false
    - name: Require artifact encryption key
      shell: pwsh
      env:
        NIMBUS_ARTIFACT_KEY: ${{ secrets.NIMBUS_ARTIFACT_KEY }}
      run: if ($env:NIMBUS_ARTIFACT_KEY.Length -ne 64) { throw "Artifact encryption key missing" }
    - name: Install pinned artifact crypto dependency
      shell: pwsh
      run: |-
        python -m pip install --disable-pip-version-check -r branding/requirements-build.txt
        if ($LASTEXITCODE -ne 0) { throw "Crypto dependency installation failed" }
    - name: Validate Nimbus branding contracts
      shell: bash
      run: python3 -m unittest branding/test_branding.py branding/test_msi_preprocess.py branding/test_artifact_crypto.py
        -v
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }

        Move-Item ./rustdesk/rustdesk.exe "./rustdesk/nimbusconnect.exe"
    - name: Smoke test Windows binary identity and version
      shell: pwsh
      run: |
        $exe = (Resolve-Path './rustdesk/nimbusconnect.exe').Path
        $info = (Get-Item $exe).VersionInfo
        if ($info.ProductName -cne 'Nimbus Connect') { throw 'Wrong product name' }
        if ($info.OriginalFilename -cne 'nimbusconnect.exe') { throw 'Wrong original filename' }
        $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput version.txt -RedirectStandardError version-error.txt
        if ($p.ExitCode -ne 0) { throw "Version probe failed: $($p.ExitCode)" }
        $reported = (Get-Content version.txt -Raw).Trim()
        if ($reported -cne $env:VERSION) { throw "Unexpected version: $reported" }
        Write-Output "Verified product: $($info.ProductName), version: $reported"
    - name: Test MSI metadata probe on real Windows client
      shell: pwsh
      env:
        NIMBUS_CLIENT_PROBE: '1'
      run: |-
        python -m unittest branding.test_msi_preprocess.BuiltWindowsClientProbe -v
        if ($LASTEXITCODE -ne 0) { throw "Windows metadata probe failed" }
    - name: Test effective Nimbus configuration
      shell: bash
      run: |
        FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
        cargo test --locked --release --lib --features "$FEATURES" common::tests::nimbus_defaults_match_the_owner_configuration -- --exact --nocapture
        cargo test --locked --release --lib --features "$FEATURES" platform::windows::nimbus_installation_name_passes_safety_validation -- --exact --nocapture
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Build self-extracted executable
      shell: bash
      run: |
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/nimbusconnect.exe"
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/NimbusConnect-${{ env.VERSION }}-windows-x64.exe
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      with:
        msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}
    - name: Prepare portable artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force PortableOutput | Out-Null
        Copy-Item ./SignOutput/*.exe ./PortableOutput/ -ErrorAction Stop
        Copy-Item LICENCE ./PortableOutput/LICENCE -ErrorAction Stop
        Get-ChildItem ./PortableOutput/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
        } | Set-Content ./PortableOutput/SHA256SUMS.txt
    - name: Encrypt Nimbus Connect portable
      shell: pwsh
      env:
        NIMBUS_ARTIFACT_KEY: ${{ secrets.NIMBUS_ARTIFACT_KEY }}
      run: |
        if ($env:NIMBUS_ARTIFACT_KEY.Length -ne 64) { throw "Encryption key unavailable; refusing upload" }
        Compress-Archive -Path ./PortableOutput/* -DestinationPath ./NimbusConnect-1.5.0-windows-x64-portable.zip -ErrorAction Stop
        python branding/artifact_crypto.py encrypt --input NimbusConnect-1.5.0-windows-x64-portable.zip --output EncryptedOutput/NimbusConnect-1.5.0-windows-x64-portable.zip.aesgcm
        if ($LASTEXITCODE -ne 0) { throw "Artifact encryption failed" }
        python branding/artifact_crypto.py decrypt --input EncryptedOutput/NimbusConnect-1.5.0-windows-x64-portable.zip.aesgcm --output verify-NimbusConnect-1.5.0-windows-x64-portable.zip
        if ($LASTEXITCODE -ne 0) { throw "Artifact authentication check failed" }
        if ((Get-FileHash NimbusConnect-1.5.0-windows-x64-portable.zip).Hash -cne (Get-FileHash verify-NimbusConnect-1.5.0-windows-x64-portable.zip).Hash) { throw "Encryption round-trip mismatch" }
        Remove-Item NimbusConnect-1.5.0-windows-x64-portable.zip,verify-NimbusConnect-1.5.0-windows-x64-portable.zip
    - name: Upload Nimbus Connect portable (encrypted)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: NimbusConnect-1.5.0-windows-x64-portable-encrypted
        path: EncryptedOutput/NimbusConnect-1.5.0-windows-x64-portable.zip.aesgcm
        if-no-files-found: error
        retention-days: 14
    - name: Build msi
      run: |
        pushd ./res/msi
        python preprocess.py --arp -d ../../rustdesk --app-name "NimbusConnect" --manufacturer "Nimbus Connect"
        if ($LASTEXITCODE -ne 0) { throw "MSI preprocessing failed: $LASTEXITCODE" }
        nuget restore msi.sln
        if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }
        msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
        if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
        $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
        if (-not $msi) { throw "Expected MSI output missing" }
        Move-Item $msi.FullName ../../SignOutput/NimbusConnect-${{ env.VERSION }}-windows-x64.msi
        popd
    - name: Write artifact checksums
      shell: pwsh
      run: |
        Copy-Item LICENCE ./SignOutput/LICENCE -ErrorAction Stop
        Get-ChildItem ./SignOutput -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
        } | Set-Content ./SignOutput/SHA256SUMS.txt
    - name: Encrypt Nimbus Connect installers
      shell: pwsh
      env:
        NIMBUS_ARTIFACT_KEY: ${{ secrets.NIMBUS_ARTIFACT_KEY }}
      run: |
        if ($env:NIMBUS_ARTIFACT_KEY.Length -ne 64) { throw "Encryption key unavailable; refusing upload" }
        Compress-Archive -Path ./SignOutput/* -DestinationPath ./NimbusConnect-1.5.0-windows-x64.zip -ErrorAction Stop
        python branding/artifact_crypto.py encrypt --input NimbusConnect-1.5.0-windows-x64.zip --output EncryptedOutput/NimbusConnect-1.5.0-windows-x64.zip.aesgcm
        if ($LASTEXITCODE -ne 0) { throw "Artifact encryption failed" }
        python branding/artifact_crypto.py decrypt --input EncryptedOutput/NimbusConnect-1.5.0-windows-x64.zip.aesgcm --output verify-NimbusConnect-1.5.0-windows-x64.zip
        if ($LASTEXITCODE -ne 0) { throw "Artifact authentication check failed" }
        if ((Get-FileHash NimbusConnect-1.5.0-windows-x64.zip).Hash -cne (Get-FileHash verify-NimbusConnect-1.5.0-windows-x64.zip).Hash) { throw "Encryption round-trip mismatch" }
        Remove-Item NimbusConnect-1.5.0-windows-x64.zip,verify-NimbusConnect-1.5.0-windows-x64.zip
    - name: Upload Nimbus Connect installers (encrypted)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: NimbusConnect-1.5.0-windows-x64-encrypted
        path: EncryptedOutput/NimbusConnect-1.5.0-windows-x64.zip.aesgcm
        if-no-files-found: error
        retention-days: 14
    timeout-minutes: 180
